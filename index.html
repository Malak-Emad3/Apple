 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iPhone 13 Pro Max</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

  <!-- Background Glowing Laser/Arc Effect -->
  <div class="bg-glow"></div>

  <!-- Header Section -->

    <div class="logo">

        <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.14-1.9-14.4-6.08-3.37-2.65-7.3-7.3-11.79-13.97-6.09-9.04-10.87-19.16-14.34-30.37-3.48-11.21-5.22-22.18-5.22-32.92 0-15.02 3.8-27.44 11.41-37.27 7.61-9.83 17.2-14.86 28.78-15.09 4.8 0 10.12 1.25 15.96 3.75 5.84 2.5 9.87 3.75 12.09 3.75 1.94 0 5.92-1.25 11.93-3.75 6.01-2.5 11.21-3.69 15.61-3.57 12.83.6 22.84 5.25 30.03 13.96-11.43 6.9-17.02 16.59-16.78 29.07.24 9.8 4.07 17.9 11.48 24.3 7.41 6.4 16.29 9.83 26.63 10.28-2.53 7.48-5.96 15.11-10.29 22.89zM119.22 31.09c0-7.36 2.71-14.28 8.13-20.78 5.42-6.5 12.21-10.31 20.37-11.43.12 1.02.18 1.92.18 2.7 0 7.24-2.83 14.22-8.49 20.94-5.66 6.72-12.51 10.51-20.55 11.37-.08-1.02-.12-1.96-.12-2.8z"/>
      </svg>
    </div>
    <nav>
      <ul>
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">Product</a></li>
        <li><a href="#">News</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content Container -->
  <main class="hero-container">
    
    <!-- Left Side Text Content -->
    <div class="hero-text">
      <span class="sub-title">THE BEST IPHONE YET</span>
      <h1 class="main-title">iPhone 13 <span class="highlight">Pro Max</span></h1>
      <p class="description">
        A powerful camera. A faster chip.<br>
        A brighter display. A premium experience.<br>
        Designed for those who want more.
      </p>
      <a href="#" class="btn-explore">Explore Products &rarr;</a>
    </div>

    <!-- Right Side Main Image -->
    <div class="hero-image">
      <img id="main-phone" src="https://assets.stickpng.com/images/61d2f83192a59500045f8269.png" alt="iPhone 13 Pro Max Graphite">
    </div>

  </main>

  <!-- Bottom Color Selector Thumbnails (Red & Gold Removed) -->
  <div class="color-selector">
    <div class="thumb active" data-color="graphite" data-img="https://assets.stickpng.com/images/61d2f83192a59500045f8269.png">
      <img src="https://assets.stickpng.com/images/61d2f83192a59500045f8269.png" alt="Graphite">
    </div>
    <div class="thumb" data-color="silver" data-img="https://assets.stickpng.com/images/61d2f85b92a59500045f826b.png">
      <img src="https://assets.stickpng.com/images/61d2f85b92a59500045f826b.png" alt="Silver">
    </div>
    <div class="thumb" data-color="sierra-blue" data-img="https://assets.stickpng.com/images/61d2f80192a59500045f8267.png">
      <img src="https://assets.stickpng.com/images/61d2f80192a59500045f8267.png" alt="Sierra Blue">
    </div>

  <script src="script.js"></script>

</html>
