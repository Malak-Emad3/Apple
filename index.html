 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iPhone 13 Pro Max</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Apple Logo">
    </div>
    <nav>
      <ul>
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">Product</a></li>
        <li><a href="#">News</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main class="hero-container">
    
    <div class="hero-text">
      <span class="sub-title">THE BEST IPHONE YET</span>
      <h1 class="main-title">iPhone 13 <span class="highlight">Pro Max</span></h1>
      <p class="description">
        A powerful camera. A faster chip.<br>
        A brighter display. A premium experience.<br>
        Designed for those who want more.
      </p>
      <a href="#" class="btn-explore">Explore Products &rarr;</a>
    </div>

    <div class="hero-image">
      <img id="main-phone" class="phone-styled" src="images/0.png" alt="iPhone 13 Pro Max">
    </div>

  </main>

  <div class="color-selector">
    <div class="thumb active" data-img="images/0.png">
      <img src="images/0.png" alt="Color 1">
    </div>
    <div class="thumb" data-img="images/1.png">
      <img src="images/1.png" alt="Color 2">
    </div>
    <div class="thumb" data-img="images/2.png">
      <img src="images/2.png" alt="Color 3">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
